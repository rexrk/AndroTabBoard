name: Build and Release Split Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env placeholder
        run: |
          touch .env
          echo "GEMINI_API_KEY=" > .env

      - name: Build Debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Stage APK
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SplitKeyboard-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitKeyboard-debug-apk
          path: app/build/outputs/apk/debug/SplitKeyboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Split Keyboard v1.0.0 (Latest Release)
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/SplitKeyboard-debug.apk
          body: |
            ## Split Touch Keyboard for Android Tablet

            ### Direct APK Download
            Tap **`SplitKeyboard-debug.apk`** below under **Assets** to download and install on your tablet.

            ### Key Features
            - **Dual Floating Thumb Panels:** Ergonomic QWERTY panels positioned on the left and right edges.
            - **Touch-Through Center Gap:** The empty space in the center is 100% transparent to touches. Scroll web pages, tap buttons, and interact with the underlying app while the keyboard is visible.
            - **Native InputMethodService:** Built with Android's native `TOUCHABLE_INSETS_REGION`—active apps retain full cursor and typing focus.
            - **Adjustable Geometry:** Drag handles to slide panels up/down for comfortable thumb reach.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
